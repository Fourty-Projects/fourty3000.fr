# pnpm >= 10 exige un champ "packages" non vide dans ce fichier,
# meme pour un projet unique. Sans lui, `pnpm install` echoue.
packages:
  - "."

# Paquets necessitant un script de build (pnpm >= 10 bloque les scripts par defaut).
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "@vercel/speed-insights"
  - sharp